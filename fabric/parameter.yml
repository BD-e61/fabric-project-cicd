find_replace:

  - find_value: "$items.Lakehouse.LH_bronze.$id"
    replace_value:
      qa: "$items.Lakehouse.LH_bronze.$id"
      prod: "$items.Lakehouse.LH_bronze.$id"
    is_regex: "true"

  - find_value: '\#\s*META\s+"default_lakehouse_workspace_id":\s*"([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"'
    replace_value:
      dev: "125b2b62-ab60-4936-954d-2570ff4a99a5"  # GUID workspace
      qa: "$workspace.$id" # resolves workspace id of target environment
      prod: "$workspace.DEMO_CICD_prod.$id" # resolved target workspace name 'DEMO_CICD_prod'
    is_regex: "true"
    item_type: "Notebook"

  - find_value: '\#\s*META\s+"default_lakehouse":\s*"([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"'
    replace_value:
      dev: "$items.Lakehouse.LH_bronze.$id"
      qa: "$items.Lakehouse.LH_bronze.$id"
      prod: "$items.Lakehouse.LH_bronze.$id"
    is_regex: "true"
    item_type: "Notebook"

  - find_value: "dev"
    replace_value:
      dev: "dev"
      qa: "qa"
      prod: "prod"
    item_type: "Notebook"

  - find_value: 'LOCATION = "Brussels"'
    replace_value:
      dev: 'LOCATION = "Brussels"'
      qa: 'LOCATION = "New York"'
      prod: 'LOCATION = "Tokyo"'
    item_type: "Notebook"

  - find_value: 'LATITUDE = 50.8503'
    replace_value:
      dev: 'LATITUDE = 50.8503'
      qa: 'LATITUDE = 40.7128'
      prod: 'LATITUDE = 35.6762'
    item_type: "Notebook"

  - find_value: 'LONGITUDE = 4.3517'
    replace_value:
      dev: 'LONGITUDE = 4.3517'
      qa: 'LONGITUDE = -74.0060'
      prod: 'LONGITUDE = 139.6503'
    item_type: "Notebook"

  - find_value: 'API_URL = "https://api.open-meteo.com/v1/forecast"'
    replace_value:
      dev: 'API_URL = "https://api.open-meteo.com/v1/forecast"'
      qa: 'API_URL = "https://api.open-meteo.com/v1/forecast"'
      prod: 'API_URL = "https://api.open-meteo.com/v1/forecast"'
    item_type: "Notebook"
